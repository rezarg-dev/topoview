<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>topoview</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1>topoview</h1>
      <span id="network-name" class="network-name"></span>
      <div class="tools">
        <label class="field">
          <span>Example</span>
          <select id="dataset">
            <option value="acme">acme (3 sites)</option>
            <option value="single-site">single-site</option>
          </select>
        </label>
        <label class="button file">
          Open file
          <input id="file" type="file" accept="application/json,.json" class="visually-hidden" />
        </label>
        <button id="reset" type="button">Reset layout</button>
        <button id="export" type="button">Save SVG</button>
        <button id="theme" type="button" aria-pressed="false">Dark mode</button>
      </div>
    </header>

    <p id="error" class="error" role="alert" hidden></p>

    <nav id="vlans" class="vlans" aria-label="Highlight a VLAN"></nav>

    <main>
      <svg id="canvas" role="group" aria-label="Network topology"></svg>
      <aside id="details" class="details" aria-live="polite"></aside>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
